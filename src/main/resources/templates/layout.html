<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · LocalLoop|">LocalLoop</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main>
    <p class="brand">LocalLoop</p>
    <h1 th:text="${title}">LocalLoop</h1>
    <p class="notice" role="status" th:if="${message}" th:text="${message}"></p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    <th:block th:replace="${content}"></th:block>
</main>
</body>
</html>
