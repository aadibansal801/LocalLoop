<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Sign in', ~{::section})}">
<section>
    <p class="error" role="alert" th:if="${param.error != null}">Sign-in failed. Check your details or try again later.</p>
    <p class="notice" role="status" th:if="${param.logout != null}">You’ve signed out.</p>
    <form method="post" th:action="@{/login}">
        <label for="username">Email address</label>
        <input id="username" name="username" type="email" autocomplete="username" maxlength="254" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
        <button type="submit">Sign in</button>
    </form>
    <nav aria-label="Account help">
        <a th:href="@{/register}">Create an account</a>
        <a th:href="@{/forgot-password}">Forgot password?</a>
    </nav>
</section>
</html>
