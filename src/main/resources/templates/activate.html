<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Activate your account', ~{::section})}">
<section>
    <form th:if="${token}" method="post" th:action="@{/activate}">
        <input type="hidden" name="token" th:value="${token}">
        <label for="name">Display name</label>
        <input id="name" name="name" type="text" autocomplete="nickname" maxlength="100" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" maxlength="72"
               aria-describedby="password-help" required>
        <p id="password-help" class="hint">Use 12–72 UTF-8 bytes. Some characters take more than one byte.</p>
        <button type="submit">Activate account</button>
    </form>
    <p><a th:href="@{/register}">Request an activation link</a></p>
</section>
</html>
