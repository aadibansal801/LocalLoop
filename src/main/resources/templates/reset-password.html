<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Set a new password', ~{::section})}">
<section>
    <form th:if="${token}" method="post" th:action="@{/reset-password}">
        <input type="hidden" name="token" th:value="${token}">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" maxlength="72"
               aria-describedby="password-help" required>
        <p id="password-help" class="hint">Use 12–72 UTF-8 bytes. Some characters take more than one byte.</p>
        <button type="submit">Reset password</button>
    </form>
    <p><a th:href="@{/forgot-password}">Request a reset link</a></p>
</section>
</html>
