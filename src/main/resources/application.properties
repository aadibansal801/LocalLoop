spring.application.name=LocalLoop
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.servlet.multipart.enabled=false

app.base-url=http://localhost:${server.port}
app.mail-from=localloop@example.test
app.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:}

server.forward-headers-strategy=none
server.address=127.0.0.1
server.port=8081
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.tomcat.max-http-form-post-size=16KB
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Constraint diagnostics can contain submitted email addresses.
logging.level.org.hibernate.orm.jdbc.error=OFF
